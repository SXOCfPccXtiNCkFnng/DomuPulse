name: Verificação

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # Valores falsos, só para o build. O CI nunca fala com Supabase,
      # Asaas ou Resend de verdade: nada de segredo real aqui.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-falso.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_falso_000000
      NEXT_PUBLIC_SITE_URL: https://pulse.domutech.digital
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes de unidade
        run: npm test

      - name: Testes de segurança do banco
        run: npm run test:db

      - name: Build
        run: npm run build
